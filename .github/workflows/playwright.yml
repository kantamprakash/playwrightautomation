name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Which npm test script to run'
        required: false
        default: 'all'
        type: choice
        options: [all, smoke, customer, user, functionality]
      browser:
        description: 'Overrides the Browser sheet in data/data.xlsx via the BROWSER env var. Note: chrome/edge channels are not installed by "playwright install --with-deps" on Linux runners.'
        required: false
        default: 'chromium'
        type: choice
        options: [chromium, firefox, webkit, chrome, edge]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: |
          SUITE="${{ github.event.inputs.test_suite || 'all' }}"
          if [ "$SUITE" = "all" ]; then
            npm test
          else
            npm run "test:$SUITE"
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-output/
          retention-days: 20

      - name: Publish test results
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Tests
          path: test-output/junit-results.xml
          reporter: java-junit
